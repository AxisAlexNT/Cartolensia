name: cartolensia

services:
  app:
    build:
      context: .
    environment:
      CARTOLENSIA_HTTP_ADDR: ":8080"
      CARTOLENSIA_DATABASE_URL: postgres://cartolensia:${CARTOLENSIA_DB_PASSWORD:-cartolensia_dev_password}@postgres:5432/${CARTOLENSIA_DB_NAME:-cartolensia}?sslmode=disable
      CARTOLENSIA_CACHE_DIR: /app/.cartolensia/cache
    ports:
      - "${CARTOLENSIA_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${CARTOLENSIA_DB_NAME:-cartolensia}
      POSTGRES_USER: ${CARTOLENSIA_DB_USER:-cartolensia}
      POSTGRES_PASSWORD: ${CARTOLENSIA_DB_PASSWORD:-cartolensia_dev_password}
    volumes:
      - cartolensia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-cpu:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile.cpu
    profiles:
      - ai-cpu
    environment:
      CARTOLENSIA_AI_PROFILE: cpu
      CARTOLENSIA_MODEL_CACHE_DIR: /models
    volumes:
      - ./.cartolensia/models:/models
    ports:
      - "${CARTOLENSIA_AI_CPU_PORT:-18090}:8090"
    restart: unless-stopped

  ai-nvidia:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile.cpu
    profiles:
      - ai-nvidia
    environment:
      CARTOLENSIA_AI_PROFILE: nvidia
      CARTOLENSIA_MODEL_CACHE_DIR: /models
    volumes:
      - ./.cartolensia/models:/models
    ports:
      - "${CARTOLENSIA_AI_NVIDIA_PORT:-18091}:8090"
    restart: unless-stopped

  ai-rocm:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile.cpu
    profiles:
      - ai-rocm
    environment:
      CARTOLENSIA_AI_PROFILE: rocm
      CARTOLENSIA_MODEL_CACHE_DIR: /models
    volumes:
      - ./.cartolensia/models:/models
    ports:
      - "${CARTOLENSIA_AI_ROCM_PORT:-18092}:8090"
    restart: unless-stopped

  ai-intel:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile.cpu
    profiles:
      - ai-intel
    environment:
      CARTOLENSIA_AI_PROFILE: intel
      CARTOLENSIA_MODEL_CACHE_DIR: /models
    volumes:
      - ./.cartolensia/models:/models
    ports:
      - "${CARTOLENSIA_AI_INTEL_PORT:-18093}:8090"
    restart: unless-stopped

volumes:
  cartolensia_pgdata:
