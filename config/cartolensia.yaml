http:
  addr: ":8080"

database:
  url: ""

cache:
  dir: ".cartolensia/cache"

storages:
  - name: fixture
    kind: fs
    root: "./testdata/media_fixture"
    mode: strict_read_only

plugins:
  enabled:
    - albums
    - mapview
    - gpstracks
    - transcoding
    - ai-base
    - ai-classification

workers:
  enabled: true
  poll_interval: "1s"
  lease_duration: "30s"
  heartbeat_interval: "10s"
  max_concurrency: 2

auth:
  mode: dev_no_auth
  admin_email: ""
  admin_display_name: "Cartolensia Admin"
  admin_password_env: CARTOLENSIA_ADMIN_PASSWORD
  admin_password_file: ""
  rotate_bootstrap_password: false
  session_ttl: "24h"
  api_token_ttl: "2160h"
  cookie_name: cartolensia_session
  cookie_secure: false
  csrf_header: X-CSRF-Token
