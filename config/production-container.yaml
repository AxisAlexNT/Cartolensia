http:
  # HTTP is only a redirect listener in production when HTTPS is enabled.
  addr: ":18080"
  tls_addr: ":18443"
  redirect_http_to_https: true
  tls_auto_self_signed: true
  tls_hosts:
    - "127.0.0.1"
    - "localhost"

database:
  url: "postgres://cartolensia:CHANGE_ME@postgres:5432/cartolensia?sslmode=disable"

cache:
  dir: "/var/lib/cartolensia/cache"
  persistent_previews: false

storages:
  - name: originals
    kind: fs
    root: "/originals"
    mode: strict_read_only

plugins:
  enabled:
    - albums
    - mapview
    - gpstracks
    - transcoding
    - ai-base
    - ai-classification

workers:
  enabled: true
  poll_interval: "1s"
  lease_duration: "30s"
  heartbeat_interval: "10s"
  max_concurrency: 4

auth:
  mode: local
  admin_email: admin@example.local
  admin_display_name: Cartolensia Admin
  admin_password_env: CARTOLENSIA_ADMIN_PASSWORD
  admin_password_file: /run/secrets/cartolensia_admin_password
  rotate_bootstrap_password: false
  session_ttl: "24h"
  api_token_ttl: "2160h"
  cookie_name: cartolensia_session
  cookie_secure: true
  csrf_header: X-CSRF-Token
